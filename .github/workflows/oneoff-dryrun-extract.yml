name: ONEOFF Dry-run extraction check (no deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRIPT_NAME: worker-damp-snowflake-cead
    steps:
      - name: Download and extract
        run: |
          set -euo pipefail
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/router-original.multipart
          wc -c /tmp/router-original.multipart
          python3 - <<'PYEOF'
          data = open('/tmp/router-original.multipart','rb').read()
          boundary = data.split(b'\r\n',1)[0]
          print("boundary:", boundary)
          parts = data.split(boundary)
          print("num parts:", len(parts))
          for i,p in enumerate(parts):
              head = p[:200]
              print(i, head[:120])
          for p in parts:
              if b'name="worker.js"' in p or b'filename="worker.js"' in p:
                  body = p.split(b'\r\n\r\n',1)[1]
                  body = body.rsplit(b'\r\n--',1)[0].rsplit(b'\r\n',1)[0]
                  open('/tmp/router-original.js','wb').write(body)
                  print("extracted", len(body), "bytes")
                  break
          else:
              raise SystemExit("could not find worker.js part")
          PYEOF
      - name: Validate extracted JS
        run: |
          set -euo pipefail
          wc -l /tmp/router-original.js
          node --check /tmp/router-original.js && echo "SYNTAX OK"
          grep -n 'const RADAR_ORIGIN = ' /tmp/router-original.js
          grep -c 'const RADAR_ORIGIN = "https://biddeed-web.vercel.app";' /tmp/router-original.js
          tail -c 300 /tmp/router-original.js | cat -A | tail -5
