name: ONEOFF Check bindings after real redeploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check bindings + full public route matrix
        run: |
          set -euo pipefail
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/worker-damp-snowflake-cead/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.result.bindings'
          echo "=== route matrix ==="
          for path in / /radar /discover /sign-in /sign-up /api/health /api/auctions/summary /api/auctions/calendar /chat /terms /privacy /disclaimer /security /data-retention /buy-report /counties; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://biddeed.ai$path")
            echo "$path -> $code"
          done
