name: ONEOFF Debug find real module name
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRIPT_NAME: worker-damp-snowflake-cead
    steps:
      - name: Download and dump multipart part headers
        run: |
          set -euo pipefail
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/router-original.multipart
          python3 - <<'PYEOF'
          data = open('/tmp/router-original.multipart','rb').read()
          boundary = data.split(b'\r\n',1)[0]
          parts = data.split(boundary)
          print("num parts:", len(parts))
          for i,p in enumerate(parts):
              # print just the header block (up to blank line) of each part
              head = p.split(b'\r\n\r\n',1)[0]
              print(f"--- part {i} headers ---")
              print(head.decode('utf-8','replace')[:500])
          PYEOF
      - name: Try metadata endpoint variant (JSON only, may show main_module)
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.' | head -100 || true
