name: ONEOFF Manual rollback - restore Vercel origin (issue 19813)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRIPT_NAME: worker-damp-snowflake-cead
    steps:
      - name: Download current (patched) router script
        run: |
          set -euo pipefail
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/router-current.multipart
          python3 - <<'PYEOF'
          data = open('/tmp/router-current.multipart','rb').read()
          boundary = data.split(b'\r\n',1)[0]
          parts = data.split(boundary)
          for p in parts:
              if b'name="worker.js"' in p:
                  body = p.split(b'\r\n\r\n',1)[1]
                  body = body.rsplit(b'\r\n--',1)[0].rsplit(b'\r\n',1)[0]
                  open('/tmp/router-current.js','wb').write(body)
                  print("extracted", len(body), "bytes")
                  break
          else:
              raise SystemExit("not found")
          PYEOF
          grep -n 'const RADAR_ORIGIN = ' /tmp/router-current.js
      - name: Restore RADAR_ORIGIN to Vercel
        run: |
          set -euo pipefail
          matches=$(grep -c 'const RADAR_ORIGIN = "https://biddeed-web-production.brevardbidderai.workers.dev";' /tmp/router-current.js)
          [ "$matches" = "1" ] || { echo "expected exactly 1 match of the canary value, found $matches" >&2; exit 1; }
          sed 's|const RADAR_ORIGIN = "https://biddeed-web-production.brevardbidderai.workers.dev";|const RADAR_ORIGIN = "https://biddeed-web.vercel.app";|' \
            /tmp/router-current.js > /tmp/router-restored.js
          orig=$(wc -l < /tmp/router-current.js); new=$(wc -l < /tmp/router-restored.js)
          [ "$orig" = "$new" ] || { echo "line count mismatch $orig vs $new" >&2; exit 1; }
          grep -n 'const RADAR_ORIGIN = ' /tmp/router-restored.js
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2024-01-01","keep_bindings":["secret_text"]}' > /tmp/meta.json
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "worker.js=@/tmp/router-restored.js;filename=worker.js;type=application/javascript+module" | jq -e '.success == true'
      - name: Verify restored -- full route matrix including /success
        run: |
          set -euo pipefail
          sleep 5
          for path in / /radar /discover /sign-in /sign-up /api/health /api/auctions/summary /api/auctions/calendar /success /chat /terms; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://biddeed.ai$path")
            echo "$path -> $code"
          done
          curl -sSI --max-time 20 "https://biddeed.ai/" | grep -iE "^(server|x-vercel-id)"
      - name: Confirm bindings survived rollback
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.result.bindings | length'
