name: Cloudflare OpenNext Production

# Fires on push to main (#19820): RADAR_ORIGIN in worker-damp-snowflake-cead
# (the biddeed.ai router, deployed from cli-anything-biddeed) is now committed
# to source pointing at biddeed-web-production's workers.dev URL, so this repo
# is the origin biddeed.ai actually serves. A push to main that doesn't also
# redeploy this Worker would leave biddeed.ai on stale code with no CI signal.
# The Worker deployed here is still NOT bound to any zone route -- it is only
# reachable by workers.dev URL; production traffic only reaches it via the
# router's RADAR_ORIGIN. See docs/spec/19813.md and docs/spec/19820.md.
#
# environment: cloudflare-staging (not cloudflare-production) is intentional
# for now -- see docs/spec/19820.md "cloudflare-production environment" for
# why and what Ariel needs to do to finish the split.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      # the gates themselves live here: a gate change must be exercised by a deploy
      - 'scripts/**'
      - 'public/**'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'open-next.config.ts'
      - 'wrangler.production.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-production.yml'

permissions:
  contents: read

# One production deploy at a time: on 2026-09-04 runs #9 and #10 raced and the older commit won.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      NEXT_PUBLIC_MAPILLARY_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPILLARY_CLIENT_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLERK_RUNTIME_ENABLED: 'true'
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare credentials are present
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID' >&2; exit 1; }
          [[ "$CLERK_SECRET_KEY" =~ ^sk_(live|test)_[A-Za-z0-9_-]+$ ]] || { echo 'CLERK_SECRET_KEY format invalid' >&2; exit 1; }
          [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" =~ ^pk_(live|test)_[A-Za-z0-9_-]+$ ]] || { echo 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY format invalid' >&2; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Missing NEXT_PUBLIC_SUPABASE_URL' >&2; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo 'Missing NEXT_PUBLIC_SUPABASE_ANON_KEY' >&2; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY' >&2; exit 1; }

      # Palette gate before anything is built: 124ffc1 (2026-09-06 19:23 UTC) pushed
      # the retired cream/terracotta palette straight to main and a deploy started
      # within seconds. The PR gate never ran because there was no PR. This step
      # makes the canon a precondition of deploying, not of reviewing.
      - name: Palette gate (canon values only, no literals outside the token files)
        run: node scripts/palette-gate.mjs

      # Same reasoning as the palette gate, applied to prices and retired terms.
      # Sessions push straight to main under one shared identity, so a silent price
      # revert would otherwise deploy green. Ariel, 2026-09-07: Pro Plus is $399.
      - name: Canon gate (prices and retired terms)
        run: node scripts/canon-gate.mjs

      # #20109: the dark-to-light conversion left form controls resting at an
      # invisible or near-invisible boundary until focus. Same reasoning as
      # the two gates above - this makes the fix a precondition of deploying,
      # not of reviewing, since sessions push straight to main with no PR.
      - name: Control-boundary gate (every control needs a visible resting edge)
        run: node scripts/control-boundary-gate.mjs

      - name: Build OpenNext Worker (production)
        # opennextjs-cloudflare build refuses to run in CI without an explicit
        # --config when there's no bare wrangler.jsonc at the repo root (there
        # isn't one here -- only the env-suffixed files). package.json's
        # cf:build has no --config, so pass it directly instead of going
        # through the npm script.
        run: npx opennextjs-cloudflare build --config wrangler.production.jsonc

      # #20053 P0: the previous version of this step (97aa6e1, 2026-09-06
      # 13:53 UTC) claimed biddeed.ai/* for this Worker and deleted every
      # other route on the zone not owned by biddeed-web-production -- which
      # deleted the legacy router's (worker-damp-snowflake-cead) route and
      # sent /deal, /r, /reels, /subscribe, /support, /contact straight into
      # this Next.js app's Clerk middleware with no matching page, producing
      # the protect-rewrite 404 this issue is about. This app implements only
      # /, /_next/*, /api/*, /radar*, /success, /order, /sign-in, /sign-up,
      # /discover, /alerts, /buy-report -- everything else is the router's.
      # Fix: this Worker releases any zone route it holds and goes back to
      # workers.dev-only, reached in production solely via the router's
      # RADAR_ORIGIN proxy (src/worker.js in cli-anything-biddeed), matching
      # wrangler.production.jsonc, which no longer declares a routes key.
      - name: Release any zone route claimed by this Worker
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zone_id=$(curl -fsS "$api/zones?name=biddeed.ai&status=active" "${auth[@]}" | jq -er '.result[0].id')
          routes=$(curl -fsS "$api/zones/$zone_id/workers/routes" "${auth[@]}")
          echo "$routes" | jq -r '.result[] | [.id,.pattern,.script] | @tsv'
          echo "$routes" | jq -r '.result[] | select(.script == "biddeed-web-production") | .id' | while read -r route_id; do
            [ -n "$route_id" ] || continue
            echo "Releasing biddeed-web-production route $route_id"
            curl -fsS -X DELETE "$api/zones/$zone_id/workers/routes/$route_id" "${auth[@]}" | jq -e '.success == true' >/dev/null
          done
      - name: Deploy production Worker (workers.dev only, no zone route)
        run: npx wrangler deploy --config wrangler.production.jsonc --env production

      - name: Bind server-only secrets to the Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --config wrangler.production.jsonc --env production
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.production.jsonc --env production

      - name: Print deployment URL without secrets
        run: |
          echo 'Cloudflare OpenNext production Worker deployed: biddeed-web-production'
          echo 'Reachable at its workers.dev URL only -- no zone route bound by this workflow.'

      - name: Public smoke checks against the workers.dev URL
        shell: bash
        run: |
          set -euo pipefail
          sub=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain')
          base="https://biddeed-web-production.$sub.workers.dev"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          curl -sS -o /dev/null --max-time 45 "$base/api/auctions/summary" || true
          for path in / /sign-in /sign-up /radar /discover /buy-report /api/health /api/auctions/summary /api/auctions/calendar; do
            code=$(curl -L -sS -o /tmp/response -w '%{http_code}' --max-time 45 "$base$path")
            echo "$path -> $code"
            [[ "$code" =~ ^2|3 ]] || { echo "Production Worker check failed for $path" >&2; exit 1; }
          done
        id: smoke

      # #20053 P0: the workers.dev checks above cannot catch this bug class --
      # the regression was a Cloudflare zone-route ownership change, which
      # only shows up against the real biddeed.ai domain. This is the
      # canonical-domain, signed-out smoke test the issue requires; it fails
      # the deploy (and therefore blocks promoting a broken route table) if
      # any of these come back non-200 (or non-302 for the /r/ short-link).
      - name: Canonical-domain smoke checks (signed-out, biddeed.ai)
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local path="$1" want="$2"
            local code
            code=$(curl -sS -o /tmp/canon_response -w '%{http_code}' --max-time 30 "https://biddeed.ai$path")
            echo "$path -> $code (want $want)"
            [[ "$code" == "$want" ]] || { echo "Canonical smoke check FAILED for $path: got $code, want $want" >&2; exit 1; }
          }
          check "/" 200
          check "/deal/polk/2024ca000341000000" 200
          check "/deal/lee/2026000141" 200
          check "/deal/broward/cace-24-008115" 200
          check "/subscribe" 200
          # P0-2 (2026-09-11): the homepage sample CTAs died silently when the old
          # sample report key expired. This is the funnel's front door - block the
          # deploy if the canonical public sample pair stops rendering.
          check "/report/04a30c35-6cef-486d-8599-ce0eb20dd79c?key=bd_live_S9KLXyeH9fV1epdliLz731n1" 200
          code=$(curl -sS -o /tmp/canon_response -D /tmp/canon_headers --max-time 30 -w '%{http_code}' "https://biddeed.ai/r/F5oeMD")
          echo "/r/F5oeMD -> $code (want 302)"
          [[ "$code" == "302" ]] || { echo "Canonical smoke check FAILED for /r/F5oeMD: got $code, want 302" >&2; cat /tmp/canon_headers >&2; exit 1; }

  # Rendered parity audit after every production deploy (PARITY_PRD.md §3.2).
  # ui-audit.yml in cli-anything-biddeed only fires on Worker deploys, so a
  # biddeed-web deploy was never audited; this job runs the SAME harness (checked
  # out from the public canon repo, never copied) against the live apex. The
  # table lands in the run summary + artifact. continue-on-error until D11
  # (0 red gates) is met, so a red table records the truth without painting
  # the deploy itself red; flip it to blocking when the board reaches D11.
  ui-parity-audit:
    needs: deploy-production
    if: ${{ always() && needs.deploy-production.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout the canon harness (cli-anything-biddeed/scripts/ui-audit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          repository: breverdbidder/cli-anything-biddeed
          sparse-checkout: scripts/ui-audit
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet playwright && python -m playwright install --with-deps chromium
      - name: Run the eight-gate audit against https://biddeed.ai
        env:
          SAMPLE_REPORT_KEY: ${{ vars.SAMPLE_REPORT_KEY }}
        run: python3 scripts/ui-audit/audit.py --base https://biddeed.ai --routes scripts/ui-audit/routes.json --out ui-audit.md --fail-on-red
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ui-audit, path: ui-audit.md }
      - if: always()
        name: Summary
        run: cat ui-audit.md >> "$GITHUB_STEP_SUMMARY"
