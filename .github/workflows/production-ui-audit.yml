name: Production UI parity audit

on:
  workflow_run:
    workflows: [Cloudflare OpenNext Production]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-ui-audit-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  ui-parity-audit:
    # workflow_run fires for all conclusions; only audit after the upstream
    # production deployment workflow has completed successfully on main.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the successfully deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Chromium audit runtime
        run: pip install --quiet playwright && python -m playwright install --with-deps chromium

      - name: Run the eight-gate audit against production
        env:
          SAMPLE_REPORT_KEY: ${{ vars.SAMPLE_REPORT_KEY }}
        run: python3 scripts/ui-audit/audit.py --base https://biddeed.ai --routes scripts/ui-audit/routes.json --out ui-audit.md --fail-on-red

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-audit
          path: ui-audit.md
