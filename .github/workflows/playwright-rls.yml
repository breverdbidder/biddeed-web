name: Authenticated Clerk RLS E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL under test (staging by default; the apex for a production proof)'
        required: false
        default: 'https://staging.biddeed.ai'
        type: string
      suite:
        description: 'rls = CP-3/CP-4 isolation suite; surfaces = CP-6 Skills + CP-8 API keys signed in; all = both'
        required: false
        default: 'rls'
        type: choice
        options: [rls, surfaces, all]

jobs:
  rls-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://staging.biddeed.ai' }}
      E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
      E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
      E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
      # clerk.signIn (server-side sign-in tokens) and the ephemeral-provisioning
      # fallback both authenticate to the Clerk Backend API with these.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # @clerk/testing is CI-only: it signs the E2E users in through Clerk's
      # server-side sign-in tokens (the UI password flow dead-ends on Client
      # Trust new-device email verification for fresh CI identities). Kept out
      # of package.json/lockfile intentionally; installed fresh every run.
      - name: Install Clerk testing helpers (CI only)
        run: npm install --no-save @clerk/testing

      # PARITY CP-3 (D10): the two-account isolation proof needs two Clerk
      # identities. When the dedicated E2E_USER_* secrets are not configured,
      # this step mints two throwaway users on the Clerk instance with the
      # workflow's own CLERK_SECRET_KEY (password + verified primary email,
      # nothing else), exports them to the suite, and the last step deletes
      # them whatever the outcome. No secret is printed; passwords are
      # generated per run and never stored.
      - name: Provision ephemeral Clerk E2E identities (only when no dedicated secrets)
        id: provision
        if: ${{ env.E2E_USER_A_EMAIL == '' }}
        shell: bash
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLERK_SECRET_KEY" || { echo 'Neither E2E_USER_* secrets nor CLERK_SECRET_KEY are available; cannot provision test identities' >&2; exit 1; }
          api="https://api.clerk.com/v1"
          auth=(-H "Authorization: Bearer $CLERK_SECRET_KEY" -H "Content-Type: application/json")
          mk() {
            local tag="$1"
            local email="e2e-${tag}-${GITHUB_RUN_ID}@e2e.biddeed.ai"
            local pass; pass="E2e!$(openssl rand -hex 12)Aa1"
            local uid
            # The instance requires email_address at creation time (422
            # 'form_data_missing' otherwise); addresses created this way come
            # back verified + primary, so no separate email_addresses call.
            uid=$(curl -fsS -X POST "$api/users" "${auth[@]}" \
              -d "$(jq -cn --arg e "$email" --arg p "$pass" --arg f "E2E" --arg l "$tag" '{email_address:[$e], password:$p, first_name:$f, last_name:$l, skip_password_checks:true, skip_password_requirement:false}')" | jq -er '.id')
            echo "::add-mask::$pass"
            echo "${tag^^}_ID=$uid" >> "$GITHUB_OUTPUT"
            echo "E2E_USER_${tag^^}_EMAIL=$email" >> "$GITHUB_ENV"
            echo "E2E_USER_${tag^^}_PASSWORD=$pass" >> "$GITHUB_ENV"
            echo "provisioned $tag -> $uid ($email)"
          }
          mk a
          mk b
          echo "provisioned=true" >> "$GITHUB_OUTPUT"

      - name: Validate test identities
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E2E_USER_A_EMAIL" || { echo 'Missing E2E_USER_A_EMAIL' >&2; exit 1; }
          test -n "$E2E_USER_A_PASSWORD" || { echo 'Missing E2E_USER_A_PASSWORD' >&2; exit 1; }
          test -n "$E2E_USER_B_EMAIL" || { echo 'Missing E2E_USER_B_EMAIL' >&2; exit 1; }
          test -n "$E2E_USER_B_PASSWORD" || { echo 'Missing E2E_USER_B_PASSWORD' >&2; exit 1; }
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # PARITY CP-4: projects.spec.ts joins the suite. E2E_S1_WAIT=1 turns on
      # the real ten-minute S1 proof (reopen after 10 min -> greeting), which
      # only makes sense here, on a manual dispatch, never on a PR check.
      - name: Run authenticated RLS suite (saved searches, watchlist, Deed chat identity, Projects)
        if: ${{ inputs.suite != 'surfaces' }}
        run: npm run test:e2e:rls
        env:
          E2E_S1_WAIT: '1'
      # PARITY CP-6 + CP-8: the signed-in pages a customer sees (Skills panel,
      # API key page). Writes one skill and deletes it through the panel; see
      # the spec header for why nothing survives the run.
      - name: Run signed-in Skills + API keys proof (PARITY CP-6, CP-8)
        if: ${{ !cancelled() && (inputs.suite == 'surfaces' || inputs.suite == 'all') }}
        run: npx playwright test tests/e2e/deed-surfaces.spec.ts
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: biddeed-clerk-rls-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Delete ephemeral Clerk E2E identities
        if: ${{ always() && steps.provision.outputs.provisioned == 'true' }}
        shell: bash
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          A_ID: ${{ steps.provision.outputs.A_ID }}
          B_ID: ${{ steps.provision.outputs.B_ID }}
        run: |
          set -uo pipefail
          for uid in "$A_ID" "$B_ID"; do
            [ -n "$uid" ] || continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "https://api.clerk.com/v1/users/$uid" -H "Authorization: Bearer $CLERK_SECRET_KEY")
            echo "delete $uid -> $code"
          done
