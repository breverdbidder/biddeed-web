name: PR production validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'public/**'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'open-next.config.ts'
      - 'wrangler.production.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr-validation.yml'
      - 'scripts/ui-audit/**'

permissions:
  contents: read

concurrency:
  group: pr-production-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-build:
    runs-on: [self-hosted, dell-gpu]
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_MAPILLARY_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPILLARY_CLIENT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: D10 Clerk identity boundary
        run: npm run test:deed-identity-boundary

      - name: Validate SIGNAL$ field release policy
        run: npm run test:report-release

      - name: Validate auction-detail paid gate
        run: npm run test:auction-detail-gate

      - name: Build production OpenNext Worker
        run: npx opennextjs-cloudflare build --config wrangler.production.jsonc

      - name: Academy runtime check (built Worker on local workerd)
        shell: bash
        run: |
          set -euo pipefail
          port=$((20000 + RANDOM % 20000))
          npx wrangler dev --config wrangler.production.jsonc --local --port "$port" > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -s -o /dev/null --max-time 5 "http://127.0.0.1:$port/academy" && break
            sleep 2
          done
          node scripts/academy-runtime-check.mjs "http://127.0.0.1:$port" || { tail -60 "$RUNNER_TEMP/wrangler-dev.log"; exit 1; }
          # Browser console/network errors on the same Academy pages (existing
          # Playwright dependency; Chromium is fetched only if not cached).
          npx playwright install chromium
          cat > .academy-console-check.mjs <<'JS'
          import { chromium } from '@playwright/test'
          import { readFileSync } from 'node:fs'
          const base = process.argv[2]
          const pages = [...readFileSync('scripts/academy-runtime-check.mjs', 'utf8').matchAll(/\['(\/academy[^']*)'/g)].map((m) => m[1])
          const browser = await chromium.launch()
          let bad = 0
          // Local-fixture limit: the local Worker has no Supabase env, so this one call returns 500. Excluded by exact URL and counted.
          const KNOWN = '/api/auctions/summary'
          let excluded = 0
          for (const p of pages) {
            const page = await browser.newPage()
            const errs = []
            page.on('console', (m) => { if (m.type() === 'error' && !(m.text().startsWith('Failed to load resource') && m.location().url === base + KNOWN)) errs.push('console: ' + m.text().slice(0, 200)) })
            page.on('response', (r) => { if (r.url() === base + KNOWN && r.status() >= 400) excluded++ })
            page.on('pageerror', (e) => errs.push('pageerror: ' + String(e).slice(0, 200)))
            page.on('response', (r) => { if (r.url().startsWith(base) && r.status() >= 400 && r.url() !== base + KNOWN) errs.push('http ' + r.status() + ' ' + r.url()) })
            await page.goto(base + p, { waitUntil: 'networkidle' })
            await page.close()
            if (errs.length) { bad++; console.error('FAIL ' + p); errs.forEach((e) => console.error('  ' + e)) } else console.log('clean ' + p)
          }
          await browser.close()
          if (bad) process.exit(1)
          console.log('excluded known local-env responses (' + KNOWN + ' >=400): ' + excluded)
          console.log('academy console check passed: ' + pages.length + ' pages')
          JS
          node .academy-console-check.mjs "http://127.0.0.1:$port" || { tail -60 "$RUNNER_TEMP/wrangler-dev.log"; exit 1; }

      - name: Upload verified candidate Worker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-worker
          path: .open-next/
          include-hidden-files: true
          retention-days: 1

  ui-parity-audit:
    needs: production-build
    runs-on: [self-hosted, dell-gpu]
    timeout-minutes: 20
    steps:
      - name: Checkout the vendored canon harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install candidate runtime dependencies
        run: npm ci

      - name: Download the exact verified candidate Worker
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-worker
          path: .open-next/

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Chromium audit runtime
        run: pip install --quiet playwright && python -m playwright install --with-deps chromium

      - name: Run the unchanged eight-gate audit against candidate Worker
        env:
          SAMPLE_REPORT_KEY: ${{ vars.SAMPLE_REPORT_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLERK_RUNTIME_ENABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          port=$((20000 + RANDOM % 20000))
          # Runtime secrets stay in an ephemeral file, never logs or artifacts.
          umask 077
          trap 'rm -f .dev.vars' EXIT
          python3 - <<'PYENV'
          import json, os
          keys = ['CLERK_SECRET_KEY', 'SUPABASE_SERVICE_ROLE_KEY', 'NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_ANON_KEY', 'CLERK_RUNTIME_ENABLED']
          with open('.dev.vars', 'w') as f:
              for k in keys:
                  if not os.environ.get(k): raise SystemExit('Missing runtime configuration: ' + k)
                  f.write(k + '=' + json.dumps(os.environ[k]) + '\n')
          os.chmod('.dev.vars', 0o600)
          PYENV
          npx wrangler dev --config wrangler.production.jsonc --local --port "$port" > "$RUNNER_TEMP/candidate-worker.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f .dev.vars' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 "http://127.0.0.1:$port/"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'Candidate Worker failed readiness'; exit 1; }
          python3 scripts/ui-audit/audit.py --base "http://127.0.0.1:$port" --routes scripts/ui-audit/routes.json --out ui-audit.md --fail-on-red

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-audit
          path: ui-audit.md
