name: PR production validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'public/**'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'open-next.config.ts'
      - 'wrangler.production.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr-validation.yml'
      - 'scripts/ui-audit/**'

permissions:
  contents: read

concurrency:
  group: pr-production-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-build:
    environment: cloudflare-staging
    runs-on: [self-hosted, dell-gpu]
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_MAPILLARY_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPILLARY_CLIENT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: D10 Clerk identity boundary
        run: npm run test:deed-identity-boundary

      - name: Validate SIGNAL$ field release policy
        run: npm run test:report-release

      - name: Validate auction-detail paid gate
        run: npm run test:auction-detail-gate

      - name: Build production OpenNext Worker
        run: npx opennextjs-cloudflare build --config wrangler.production.jsonc

      - name: Academy runtime check (built Worker on local workerd)
        shell: bash
        run: |
          set -euo pipefail
          port=$((20000 + RANDOM % 20000))
          npx wrangler dev --config wrangler.production.jsonc --local --port "$port" > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -s -o /dev/null --max-time 5 "http://127.0.0.1:$port/academy" && break
            sleep 2
          done
          node scripts/academy-runtime-check.mjs "http://127.0.0.1:$port" || { tail -60 "$RUNNER_TEMP/wrangler-dev.log"; exit 1; }
          # Browser console/network errors on the same Academy pages (existing
          # Playwright dependency; Chromium is fetched only if not cached).
          npx playwright install chromium
          cat > .academy-console-check.mjs <<'JS'
          import { chromium } from '@playwright/test'
          import { readFileSync } from 'node:fs'
          const base = process.argv[2]
          const pages = [...readFileSync('scripts/academy-runtime-check.mjs', 'utf8').matchAll(/\['(\/academy[^']*)'/g)].map((m) => m[1])
          const browser = await chromium.launch()
          let bad = 0
          // Local-fixture limit: the local Worker has no Supabase env, so this one call returns 500. Excluded by exact URL and counted.
          const KNOWN = '/api/auctions/summary'
          let excluded = 0
          for (const p of pages) {
            const page = await browser.newPage()
            const errs = []
            page.on('console', (m) => { if (m.type() === 'error' && !(m.text().startsWith('Failed to load resource') && m.location().url === base + KNOWN)) errs.push('console: ' + m.text().slice(0, 200)) })
            page.on('response', (r) => { if (r.url() === base + KNOWN && r.status() >= 400) excluded++ })
            page.on('pageerror', (e) => errs.push('pageerror: ' + String(e).slice(0, 200)))
            page.on('response', (r) => { if (r.url().startsWith(base) && r.status() >= 400 && r.url() !== base + KNOWN) errs.push('http ' + r.status() + ' ' + r.url()) })
            await page.goto(base + p, { waitUntil: 'networkidle' })
            await page.close()
            if (errs.length) { bad++; console.error('FAIL ' + p); errs.forEach((e) => console.error('  ' + e)) } else console.log('clean ' + p)
          }
          await browser.close()
          if (bad) process.exit(1)
          console.log('excluded known local-env responses (' + KNOWN + ' >=400): ' + excluded)
          console.log('academy console check passed: ' + pages.length + ' pages')
          JS
          node .academy-console-check.mjs "http://127.0.0.1:$port" || { tail -60 "$RUNNER_TEMP/wrangler-dev.log"; exit 1; }

      - name: Upload verified candidate Worker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-worker
          path: .open-next/
          include-hidden-files: true
          retention-days: 1

  ui-parity-audit:
    needs: production-build
    environment: cloudflare-staging
    runs-on: [self-hosted, dell-gpu]
    timeout-minutes: 20
    steps:
      - name: Checkout the vendored canon harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install candidate runtime dependencies
        run: npm ci

      - name: Download the exact verified candidate Worker
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-worker
          path: .open-next/

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Chromium audit runtime
        run: pip install --quiet playwright && python -m playwright install --with-deps chromium

      - name: Read pinned production front-router source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: breverdbidder/cli-anything-biddeed
          ref: 3f1770cd7c4098f9079c771362ce02f0680f6243
          path: .candidate-front
          persist-credentials: false
          sparse-checkout: |
            src/worker.js
            wrangler.toml

      - name: Run the unchanged eight-gate audit against candidate Worker
        env:
          SAMPLE_REPORT_KEY: ${{ vars.SAMPLE_REPORT_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLERK_RUNTIME_ENABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          port=$((20000 + RANDOM % 10000))
          front_port=$((31000 + RANDOM % 10000))
          # Runtime secrets stay in an ephemeral file, never logs or artifacts.
          umask 077
          trap 'rm -f .dev.vars' EXIT
          python3 - <<'PYENV'
          import json, os
          keys = ['NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY', 'NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_ANON_KEY', 'CLERK_RUNTIME_ENABLED']
          with open('.dev.vars', 'w') as f:
              for k in keys:
                  if not os.environ.get(k): raise SystemExit('Missing runtime configuration: ' + k)
                  f.write(k + '=' + json.dumps(os.environ[k]) + '\n')
          os.chmod('.dev.vars', 0o600)
          PYENV
          # Safety instrumentation only: deny outbound mutations in the Next
          # isolate too. The same built artifact is otherwise unchanged.
          python3 - <<'PYNEXT'
          from pathlib import Path
          p=Path('.open-next/worker.js')
          guard="""const candidateOriginalFetch = globalThis.fetch.bind(globalThis);
          globalThis.fetch = (input, init) => {
            const method = String(init?.method || input?.method || 'GET').toUpperCase();
            if (!['GET','HEAD'].includes(method)) return Promise.resolve(new Response('Read-only candidate verification', {status:403}));
            return candidateOriginalFetch(input, init);
          };
          """
          p.write_text(guard+p.read_text())
          PYNEXT
          npx wrangler dev --config wrangler.production.jsonc --local --port "$port" > "$RUNNER_TEMP/candidate-worker.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" ${front_pid:-} 2>/dev/null || true; rm -f .dev.vars; rm -rf .candidate-front' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 "http://127.0.0.1:$port/"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'Candidate Worker failed readiness'; exit 1; }
          export CANDIDATE_NEXT_PORT="$port"
          python3 - <<'PYFRONT'
          import os,json,hashlib,pathlib
          root=pathlib.Path('.candidate-front')
          source=root/'src/worker.js'
          raw=source.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'ebce246e55f80b710c32bcee2e1b808927f0491e76d418ca734074331883d44b', 'Front-router source drift'
          local='http://127.0.0.1:'+os.environ['CANDIDATE_NEXT_PORT']
          old='const RADAR_ORIGIN = "https://biddeed-web-production.brevardbidderai.workers.dev";'
          text=raw.decode()
          assert text.count(old)==1
          text=text.replace(old,'const RADAR_ORIGIN = '+json.dumps(local)+';')
          # Deny every mutating external fetch, including passive log writes.
          # This guard exists only in the ephemeral local verification source.
          guard="""const originalFetch = globalThis.fetch.bind(globalThis);
          globalThis.fetch = (input, init) => {
            const method = String(init?.method || input?.method || 'GET').toUpperCase();
            if (!['GET','HEAD'].includes(method)) return Promise.resolve(new Response('Read-only candidate verification', {status:403}));
            return originalFetch(input, init);
          };
          """
          source.write_text(guard+text)
          (root/'verify.js').write_text("import worker, { RateLimiterCounter } from './src/worker.js';\nexport { RateLimiterCounter };\nexport default { fetch(request, env, ctx) { if (!['GET','HEAD'].includes(request.method)) return new Response('Read-only candidate verification',{status:403}); return worker.fetch(request,env,ctx); } };\n")
          cfg={'name':'biddeed-front-local-verification','main':'verify.js','compatibility_date':'2024-01-01','durable_objects':{'bindings':[{'name':'RATE_LIMIT_DO','class_name':'RateLimiterCounter'}]},'migrations':[{'tag':'v1-rate-limit-do','new_sqlite_classes':['RateLimiterCounter']}]}
          (root/'verify.json').write_text(json.dumps(cfg))
          print('Pinned front-router verified; ephemeral origin and read-only guards only; no production bindings')
          PYFRONT
          npx wrangler dev --config .candidate-front/verify.json --local --port "$front_port" > "$RUNNER_TEMP/front-worker.log" 2>&1 &
          front_pid=$!
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 "http://127.0.0.1:$front_port/"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'Front-router candidate failed readiness'; exit 1; }
          python3 scripts/ui-audit/audit.py --base "http://127.0.0.1:$front_port" --routes scripts/ui-audit/routes.json --out ui-audit.md --fail-on-red

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-audit
          path: ui-audit.md
