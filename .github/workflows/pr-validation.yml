name: PR production validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'public/**'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'open-next.config.ts'
      - 'wrangler.production.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/e2e/**'
      - '.github/workflows/pr-validation.yml'
      - 'scripts/ui-audit/**'

permissions:
  contents: read

concurrency:
  group: pr-production-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-build:
    runs-on: [self-hosted, dell-gpu]
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_PATH: ''
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: D10 Clerk identity boundary
        run: npm run test:deed-identity-boundary

      - name: Validate SIGNAL$ field release policy
        run: npm run test:report-release

      - name: Validate auction-detail paid gate
        run: npm run test:auction-detail-gate

      - name: Validate auction route contracts
        run: npm run test:auction-route-contract

      - name: Run mocked auction route browser regression
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/auction-route-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/auctions -o /dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/auction-route-next.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/auction-route-next.log; exit 1; fi
          E2E_BASE_URL=http://127.0.0.1:3000 npm run test:e2e:auction-route-contract

      - name: Build production OpenNext Worker
        run: npx opennextjs-cloudflare build --config wrangler.production.jsonc

  ui-parity-audit:
    needs: production-build
    runs-on: [self-hosted, dell-gpu]
    timeout-minutes: 20
    steps:
      - name: Checkout the vendored canon harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Chromium audit runtime
        run: pip install --quiet playwright && python -m playwright install --with-deps chromium

      - name: Run the eight-gate audit against production
        env:
          SAMPLE_REPORT_KEY: ${{ vars.SAMPLE_REPORT_KEY }}
        run: python3 scripts/ui-audit/audit.py --base https://biddeed.ai --routes scripts/ui-audit/routes.json --out ui-audit.md --fail-on-red

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-audit
          path: ui-audit.md
