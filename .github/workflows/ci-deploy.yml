name: CI + Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20. MEASURED 2026-08-20: `npm install --package-lock-only`
      # fails on this runner under Node 20 because .npmrc sets engine-strict=true
      # and nanoid — pulled in transitively by @assistant-ui/react via
      # @assistant-ui/core and assistant-stream — declares
      # engines.node "^22 || ^24 || >=26". Node 20 satisfies none of those, so
      # npm hard-fails before it writes a lockfile. This is NOT fixed by
      # dropping engine-strict: that would only defer the same incompatibility
      # to runtime. Everything else in the tree (next 16.1.6 wants >=20.9)
      # is happy on 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Separate step so a type error reads as a type error, not as an opaque
      # "next build failed".
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          # --prod so main lands on the stable biddeed-web.vercel.app alias
          # instead of a throwaway per-commit URL nobody can bookmark.
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"

      - name: Smoke-check the deployment
        run: |
          set -euo pipefail
          fail=0
          # basePath is gone: the app serves the apex, the workspace lives at
          # /radar, the API is at /api/* and the order page at /order/success.
          # /auctions and /success are deliberately absent - both belong to the
          # Worker, /success because it is a live Stripe success_url.
          for path in "/" "/radar" "/order/success" "/api/auctions/summary"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "${PREVIEW_URL}${path}")
            bytes=$(wc -c < /tmp/body)
            echo "${path} -> HTTP ${code}, ${bytes} bytes"
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned HTTP ${code}"
              fail=1
            fi
            # A shell that paints nothing is the failure mode this rebuild exists to end.
            if [ "$bytes" -lt 1000 ]; then
              echo "::error::${path} returned only ${bytes} bytes - suspiciously empty"
              fail=1
            fi
          done
          exit $fail

      # A 200 with a big body proves the SERVER worked. It says nothing about
      # whether the browser was allowed to run the page: this project shipped
      # green once while every script was refused by CSP. Under 'strict-dynamic'
      # the browser trusts ONLY nonced scripts, so assert that the app sends its
      # own CSP, that the CSP carries a nonce, and that the HTML uses it. A
      # statically prerendered route can never satisfy the last one.
      - name: Assert the browser can actually run the page
        run: |
          set -euo pipefail
          fail=0
          for path in "/" "/radar" "/order/success"; do
            csp=$(curl -s -D - -o /tmp/page --max-time 30 "${PREVIEW_URL}${path}" \
                  | tr -d '\r' | grep -i '^content-security-policy:' || true)
            nonce=$(printf '%s' "$csp" | grep -o "nonce-[A-Za-z0-9+/=]*" | head -1 || true)
            nonced=$(grep -c 'nonce=' /tmp/page || true)
            echo "${path}: csp=$([ -n "$csp" ] && echo yes || echo NO) nonce=$([ -n "$nonce" ] && echo yes || echo NO) tags_with_nonce=${nonced}"
            if [ -z "$csp" ]; then
              echo "::error::${path} sent no content-security-policy - the Worker's own CSP would apply and the map will not paint"
              fail=1
            fi
            if [ -z "$nonce" ]; then
              echo "::error::${path} CSP carries no nonce - middleware did not run on this route"
              fail=1
            fi
            if [ "${nonced:-0}" -lt 1 ]; then
              echo "::error::${path} has no nonced script tags - is this route statically prerendered?"
              fail=1
            fi
          done
          exit $fail

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "URL: ${PREVIEW_URL:-(deploy did not complete)}"
          } >> "$GITHUB_STEP_SUMMARY"
