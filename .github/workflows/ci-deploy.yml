name: CI + Vercel Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Typecheck is a separate step so a type error reads as a type error,
      # not as an opaque "next build failed".
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"

      - name: Smoke-check the deployed preview
        run: |
          set -euo pipefail
          fail=0
          for path in "/" "/auctions" "/api/auctions/summary" "/api/auctions/calendar"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "${PREVIEW_URL}${path}")
            bytes=$(wc -c < /tmp/body)
            echo "${path} -> HTTP ${code}, ${bytes} bytes"
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned HTTP ${code}"
              fail=1
            fi
            # A shell that paints nothing is the exact failure mode this rebuild exists to end.
            if [ "$bytes" -lt 1000 ]; then
              echo "::error::${path} returned only ${bytes} bytes — suspiciously empty"
              fail=1
            fi
          done
          exit $fail

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Preview deployment"
            echo ""
            echo "URL: ${PREVIEW_URL:-(deploy did not complete)}"
          } >> "$GITHUB_STEP_SUMMARY"
