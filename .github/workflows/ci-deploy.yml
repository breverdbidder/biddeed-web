name: CI + Vercel Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Typecheck is a separate step so a type error reads as a type error,
      # not as an opaque "next build failed".
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"

      - name: Smoke-check the deployed preview
        run: |
          set -euo pipefail
          fail=0
          for path in "/" "/auctions" "/api/auctions/summary" "/api/auctions/calendar"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "${PREVIEW_URL}${path}")
            bytes=$(wc -c < /tmp/body)
            echo "${path} -> HTTP ${code}, ${bytes} bytes"
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned HTTP ${code}"
              fail=1
            fi
            # A shell that paints nothing is the exact failure mode this rebuild exists to end.
            if [ "$bytes" -lt 1000 ]; then
              echo "::error::${path} returned only ${bytes} bytes — suspiciously empty"
              fail=1
            fi
          done
          exit $fail

      # A 200 with a big body proves the SERVER worked. It says nothing about
      # whether the browser was allowed to run the page. The preview shipped
      # green once already while every script on it was refused by CSP, so
      # assert the invariant that actually failed: under 'strict-dynamic' the
      # browser trusts ONLY nonced scripts, therefore every script tag must
      # carry a nonce. A statically prerendered route can never satisfy this,
      # which is exactly what we want the build to tell us.
      - name: Assert the browser can actually run the page
        run: |
          set -euo pipefail
          python3 - "$PREVIEW_URL" <<'PY'
          import re, sys, urllib.request
          base = sys.argv[1]
          failed = False
          for path in ("/", "/auctions"):
              req = urllib.request.Request(base + path, headers={"User-Agent": "ci-smoke"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  html = r.read().decode("utf-8", "replace")
                  csp = (r.headers.get("content-security-policy")
                         or r.headers.get("content-security-policy-report-only") or "")
              tags = re.findall(r"<script\b[^>]*>", html)
              unnonced = [t for t in tags if " src=" in t and "nonce=" not in t]
              print(f"{path}: {len(tags)} script tags, {len(unnonced)} src tags without a nonce")
              if "strict-dynamic" in csp and unnonced:
                  print(f"::error::{path} serves {len(unnonced)} unnonced script tag(s) under a "
                        f"'strict-dynamic' CSP - the browser will refuse them and the page "
                        f"will never hydrate. Is this route statically prerendered?")
                  failed = True
              if not tags:
                  print(f"::error::{path} served no script tags at all")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Preview deployment"
            echo ""
            echo "URL: ${PREVIEW_URL:-(deploy did not complete)}"
          } >> "$GITHUB_STEP_SUMMARY"
