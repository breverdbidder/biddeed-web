name: CI + Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # The URL real users hit. The smoke check asserts THIS, not the per-deployment
  # URL — see the "Smoke-check" step for why, and for how it avoids the trap
  # that makes an alias check meaningless.
  PROD_URL: https://biddeed-web.vercel.app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      # Node 22, not 20. MEASURED 2026-08-20: `npm ci` fails on this runner under
      # Node 20 because .npmrc sets engine-strict=true and nanoid — pulled in
      # transitively by @assistant-ui/react via @assistant-ui/core and
      # assistant-stream — declares engines.node "^22 || ^24 || >=26". Node 20
      # satisfies none of those. This is NOT fixed by dropping engine-strict:
      # that would only defer the same incompatibility to runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci, never npm install. It refuses to run when package-lock.json
      # disagrees with package.json, which is the point: a dependency change is
      # only half a change until the lock is regenerated. If this step fails on
      # lockfile drift, run the "Relock" workflow — do not soften this command.
      - name: Install dependencies
        run: npm ci

      # Separate step so a type error reads as a type error, not as an opaque
      # "next build failed".
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # GitHub Secrets are not automatically runtime variables in Vercel. Keep the
      # Clerk pair in GitHub, but synchronize it into Vercel Production before
      # pulling/building. Values are passed over stdin and are never printed.
      - name: Sync Clerk production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLERK_SECRET_KEY" || { echo "Missing GitHub Secret: CLERK_SECRET_KEY" >&2; exit 1; }
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" || { echo "Missing GitHub Secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" >&2; exit 1; }
          vercel env rm CLERK_SECRET_KEY production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          vercel env rm NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' "$CLERK_SECRET_KEY" | vercel env add CLERK_SECRET_KEY production --token="$VERCEL_TOKEN" >/dev/null
          printf '%s' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" | vercel env add NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY production --token="$VERCEL_TOKEN" >/dev/null

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          # --prod so main lands on the stable biddeed-web.vercel.app alias
          # instead of a throwaway per-commit URL nobody can bookmark.
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      # The per-deployment URL is reported, never asserted. This project has
      # deployment protection enabled on those URLs, so an unauthenticated curl
      # gets 401 — which is correct behaviour, not a failure. Run 32394019653
      # (2026-08-20) died here at four seconds with a green build and a green
      # deploy behind it. Logged explicitly rather than skipped silently.
      - name: Report the per-deployment URL
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${DEPLOY_URL}/api/health" || echo 000)
          echo "Deployment URL: ${DEPLOY_URL} -> HTTP ${code}"
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::notice::Per-deployment URL is behind Vercel deployment protection (HTTP ${code}). Asserting the production alias instead."
          fi

      # Wait for the alias to actually serve THIS commit.
      #
      # Asserting the alias without this would be a check that cannot fail: the
      # alias answers 200 for the previous deployment too, so a deploy that
      # never promoted would still look green. /api/health reports the commit
      # its bundle was built from (next.config.mjs inlines GITHUB_SHA), so the
      # SHA comparison is what makes the assertion mean something.
      - name: Wait for the alias to serve this commit
        run: |
          set -euo pipefail
          want="${GITHUB_SHA}"
          echo "Waiting for ${PROD_URL}/api/health to report sha=${want}"
          for i in $(seq 1 40); do
            got=$(curl -s --max-time 15 "${PROD_URL}/api/health" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p' || true)
            if [ "$got" = "$want" ]; then
              echo "Alias is serving ${want} after $((i*5))s."
              exit 0
            fi
            echo "  attempt ${i}: alias reports sha='${got:-<none>}'"
            sleep 5
          done
          echo "::error::${PROD_URL} never reported sha=${want}. The deploy did not promote to the production alias."
          exit 1

      - name: Smoke-check the production alias
        run: |
          set -euo pipefail
          fail=0
          # /auctions and /success are deliberately absent from this list — both
          # belong to the Worker, /success because it is a live Stripe
          # success_url. /api/deed is POST-only and is exercised by its own step.
          for path in "/" "/radar" "/radar?view=calendar" "/order/success" \
                      "/api/health" "/api/auctions/summary" "/api/auctions/calendar" "/api/csp-report"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "${PROD_URL}${path}")
            bytes=$(wc -c < /tmp/body)
            echo "${path} -> HTTP ${code}, ${bytes} bytes"
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned HTTP ${code}"
              fail=1
            fi
            # A shell that paints nothing is the failure mode this rebuild exists
            # to end. API routes are exempt from the size floor: a correct JSON
            # response can legitimately be small.
            case "$path" in
              /api/*) ;;
              *) if [ "$bytes" -lt 1000 ]; then
                   echo "::error::${path} returned only ${bytes} bytes - suspiciously empty"
                   fail=1
                 fi ;;
            esac
          done
          exit $fail

      # The auction figures on screen come from auctions_summary_ssot(). If that
      # RPC is unreachable the page still renders — em-dashes everywhere — and
      # every check above still passes. This is the difference between "the page
      # loaded" and "the page is telling the truth".
      - name: Assert the data layer is actually answering
        run: |
          set -euo pipefail
          body=$(curl -s --max-time 30 "${PROD_URL}/api/auctions/summary")
          # jq, not sed. "total" appears once per entry inside counties_detail,
          # so a greedy sed capture grabs the LAST one - a single county's total,
          # around 57 - instead of the top-level figure. That is exactly how this
          # check failed its own first run (32397434360). The fix is an exact
          # parse, not a lower threshold.
          total=$(printf '%s' "$body" | jq -r '.total // empty')
          counties=$(printf '%s' "$body" | jq -r '.counties // empty')
          upcoming=$(printf '%s' "$body" | jq -r '.upcoming // empty')
          echo "summary: total=${total:-<none>} counties=${counties:-<none>} upcoming=${upcoming:-<none>}"
          if [ -z "${total:-}" ] || [ "${total}" -lt 1000 ]; then
            echo "::error::/api/auctions/summary reported total='${total:-<none>}'. The SSOT RPC is not answering."
            exit 1
          fi
          if [ "${counties:-0}" -ne 67 ]; then
            echo "::error::/api/auctions/summary reported counties='${counties:-<none>}', expected 67 Florida counties."
            exit 1
          fi
          # "0 upcoming auctions across Florida" is not a real state - it is what
          # a silently broken query looks like, and it has shipped before.
          if [ -z "${upcoming:-}" ] || [ "${upcoming}" -lt 1 ]; then
            echo "::error::/api/auctions/summary reported upcoming='${upcoming:-<none>}'. That is a broken query, not a quiet week."
            exit 1
          fi

      # A 200 with a big body proves the SERVER worked. It says nothing about
      # whether the browser was allowed to run the page: this project shipped
      # green once while every script was refused by CSP. Under 'strict-dynamic'
      # the browser trusts ONLY nonced scripts, so assert that the app sends its
      # own CSP, that the CSP carries a nonce, and that the HTML uses it. A
      # statically prerendered route can never satisfy the last one.
      - name: Assert the browser can actually run the page
        run: |
          set -euo pipefail
          fail=0
          for path in "/" "/radar" "/order/success"; do
            csp=$(curl -s -D - -o /tmp/page --max-time 30 "${PROD_URL}${path}" \
                  | tr -d '\r' | grep -i '^content-security-policy:' || true)
            nonce=$(printf '%s' "$csp" | grep -o "nonce-[A-Za-z0-9+/=]*" | head -1 || true)
            nonced=$(grep -c 'nonce=' /tmp/page || true)
            echo "${path}: csp=$([ -n "$csp" ] && echo yes || echo NO) nonce=$([ -n "$nonce" ] && echo yes || echo NO) tags_with_nonce=${nonced}"
            if [ -z "$csp" ]; then
              echo "::error::${path} sent no content-security-policy - the Worker's own CSP would apply and the map will not paint"
              fail=1
            fi
            if [ -z "$nonce" ]; then
              echo "::error::${path} CSP carries no nonce - middleware did not run on this route"
              fail=1
            fi
            if [ "${nonced:-0}" -lt 1 ]; then
              echo "::error::${path} has no nonced script tags - is this route statically prerendered?"
              fail=1
            fi
          done
          exit $fail

      # Two zero-tolerance greps. Both are rules the product is built on, and
      # both are one careless edit away from coming back.
      - name: Assert the hard rules still hold
        run: |
          set -euo pipefail
          fail=0
          if grep -rn "dangerouslySetInnerHTML" --include='*.ts' --include='*.tsx' app components lib types \
             | grep -v '^\S*: *\*' | grep -v '//' ; then
            echo "::error::dangerouslySetInnerHTML found. Model output is never written to the DOM as HTML."
            fail=1
          fi
          if grep -rn "PropertyOnion\|propertyonion" --include='*.ts' --include='*.tsx' app components lib types ; then
            echo "::error::Banned term found in the rendered surface."
            fail=1
          fi
          exit $fail

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Deployment URL | ${DEPLOY_URL:-(deploy did not complete)} |"
            echo "| Production alias | ${PROD_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
