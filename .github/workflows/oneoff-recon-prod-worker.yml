name: ONEOFF Recon Production Worker Routing Logic 2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recon:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Fetch full worker source
        run: |
          set -euo pipefail
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/worker-damp-snowflake-cead" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/worker-src.txt
      - name: Dump lines 1690-1900 (RADAR_ORIGIN proxy block)
        run: sed -n '1690,1900p' /tmp/worker-src.txt
      - name: Dump lines 2780-2830 (auction workspace JSON note)
        run: sed -n '2780,2830p' /tmp/worker-src.txt
      - name: Canonical host / clerk-host references
        run: grep -n -i "canonical.host\|X-Biddeed-Canonical-Host\|ROUTER_PROXY_KEY" /tmp/worker-src.txt
