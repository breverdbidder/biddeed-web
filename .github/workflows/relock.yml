name: Relock

# Regenerates package-lock.json from package.json and commits it.
#
# WHY THIS EXISTS. ci-deploy.yml runs `npm ci`, which refuses to install when
# the lockfile disagrees with package.json — that is the whole point of `npm ci`
# and it must NOT be softened to `npm install`. The consequence is that a
# dependency change is only half a change until the lockfile is regenerated, and
# runs 78-81 (2026-08-18) all died at "Install dependencies" in ~16 seconds
# because 95 entries were missing from the lock. Nothing deployed for two days.
#
# A lockfile is a generated artifact: any machine with the same npm can produce
# it from package.json. This workflow is that machine. Run it after any
# dependency change that lands without a regenerated lock.
#
# It is manual-only on purpose. An automatic relock on every push would silently
# absorb dependency drift, which is exactly the failure `npm ci` exists to make
# loud.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      # Node 22, not 20. MEASURED 2026-08-20: `npm install --package-lock-only`
      # fails on this runner under Node 20 because .npmrc sets engine-strict=true
      # and nanoid — pulled in transitively by @assistant-ui/react via
      # @assistant-ui/core and assistant-stream — declares
      # engines.node "^22 || ^24 || >=26". Node 20 satisfies none of those, so
      # npm hard-fails before it writes a lockfile. This is NOT fixed by
      # dropping engine-strict: that would only defer the same incompatibility
      # to runtime. Everything else in the tree (next 16.1.6 wants >=20.9)
      # is happy on 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Regenerate the lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      # Prove the regenerated lock is actually installable before committing it.
      # Committing a lock that npm ci then rejects would just move the failure.
      - name: Verify npm ci accepts it
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Verify the app still typechecks and builds
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx next build --webpack

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate package-lock.json from package.json" -m "Generated by .github/workflows/relock.yml. npm ci, tsc --noEmit and next build were all verified against this lockfile before it was committed."
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "## Relock"
            echo ""
            git log --oneline -1
          } >> "$GITHUB_STEP_SUMMARY"
