name: Cloudflare OpenNext Staging

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-staging]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'open-next.config.ts'
      - 'wrangler.staging.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-staging.yml'

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLERK_RUNTIME_ENABLED: 'true'
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare credentials are present
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_API_TOKEN repository/environment secret' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID repository/environment secret' >&2; exit 1; }
          [[ "$CLERK_SECRET_KEY" =~ ^sk_(live|test)_[A-Za-z0-9_-]+$ ]] || { echo 'CLERK_SECRET_KEY format invalid' >&2; exit 1; }
          [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" =~ ^pk_(live|test)_[A-Za-z0-9_-]+$ ]] || { echo 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY format invalid' >&2; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Missing NEXT_PUBLIC_SUPABASE_URL environment secret' >&2; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo 'Missing NEXT_PUBLIC_SUPABASE_ANON_KEY environment secret' >&2; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY environment secret' >&2; exit 1; }

      - name: Build OpenNext Worker
        run: npm run cf:build

      - name: Free staging.biddeed.ai route from legacy worker
        shell: bash
        run: |
          set -euo pipefail
          zone_id=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=biddeed.ai" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo 'Could not resolve zone id for biddeed.ai' >&2
            exit 1
          fi
          routes=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          route_id=$(echo "$routes" | jq -r '.result[] | select(.pattern=="staging.biddeed.ai/*") | .id // empty')
          route_script=$(echo "$routes" | jq -r '.result[] | select(.pattern=="staging.biddeed.ai/*") | .script // empty')
          if [ -n "$route_id" ]; then
            echo "Existing route staging.biddeed.ai/* -> script '$route_script' (route id $route_id)"
            if [ "$route_script" != "biddeed-web-staging" ]; then
              echo "Deleting route from legacy worker '$route_script' so biddeed-web-staging can claim it (production biddeed.ai/* untouched)"
              curl -sS -X DELETE "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes/$route_id" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                | jq -e '.success' > /dev/null
              echo "Route freed."
            else
              echo "Route already assigned to biddeed-web-staging, nothing to do."
            fi
          else
            echo "No existing route found for staging.biddeed.ai/*, proceeding to deploy."
          fi

      - name: Deploy staging Worker
        run: npx wrangler deploy --config wrangler.staging.jsonc --env staging

      - name: Bind server-only secrets to the Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          # Next.js only inlines NEXT_PUBLIC_* vars at build time. Plain
          # process.env lookups (lib/clerk-host.ts's clerkLive check, the
          # Supabase service-role fallback) need an actual Wrangler-bound
          # runtime secret on the Worker -- a GitHub Actions job env var
          # alone never reaches process.env inside the deployed Worker.
          # wrangler secret put reads the value from stdin only; it is
          # never echoed, logged, or passed as a CLI argument.
          printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --config wrangler.staging.jsonc --env staging
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.staging.jsonc --env staging

      - name: TEMP diagnose /sign-in 500
        shell: bash
        run: |
          set +e
          npx wrangler tail --config wrangler.staging.jsonc --env staging --format json > /tmp/tail.log 2>&1 &
          tail_pid=$!
          sleep 5
          curl -sS -o /dev/null --max-time 20 "https://staging.biddeed.ai/sign-in"
          sleep 3
          kill $tail_pid 2>/dev/null
          wait $tail_pid 2>/dev/null
          python3 -c "
import json
with open('/tmp/tail.log') as f:
    for line in f:
        line=line.strip()
        if not line or not line.startswith('{'):
            continue
        try:
            ev = json.loads(line)
        except Exception:
            continue
        for log in ev.get('logs', []):
            print('LOG:', log.get('level'), log.get('message'))
        exc = ev.get('exceptions', [])
        for e in exc:
            print('EXCEPTION:', e.get('name'), e.get('message'))
"

      - name: Print deployment URL without secrets
        run: |
          echo 'Cloudflare OpenNext staging deployment completed.'
          echo 'Expected custom hostname: https://staging.biddeed.ai'

      - name: Public staging smoke checks
        shell: bash
        run: |
          base='https://staging.biddeed.ai'
          # First hit after a fresh deploy pays Worker cold-start + a cold Postgres
          # aggregation (auctions_summary_ssot() over multi_county_auctions) in one
          # request -- observed 17s once, then 8s/5s/3s/2s on immediate retries.
          # A single warm-up call absorbs that before the timed checks run.
          curl -sS -o /dev/null --max-time 45 "$base/api/auctions/summary" || true
          for path in / /sign-in /sign-up /radar /discover /api/health /api/auctions/summary /api/auctions/calendar; do
            code=$(curl -L -sS -o /tmp/response -w '%{http_code}' --max-time 45 "$base$path")
            echo "$path -> $code"
            case "$path" in
              /api/health|/api/auctions/summary|/api/auctions/calendar)
                [[ "$code" =~ ^2|3 ]] || { echo "Staging API check failed for $path" >&2; exit 1; } ;;
              *)
                [[ "$code" =~ ^2|3 ]] || { echo "Staging page check failed for $path" >&2; exit 1; } ;;
            esac
          done
