name: ONEOFF Canary - repoint RADAR_ORIGIN to Cloudflare (issue 19813)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CANARY to proceed'
        required: true
permissions:
  contents: read
jobs:
  canary:
    if: github.event.inputs.confirm == 'CANARY'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEW_ORIGIN: https://biddeed-web-production.brevardbidderai.workers.dev
      SCRIPT_NAME: worker-damp-snowflake-cead
    steps:
      - name: Download current router script (kept only in job workspace, never printed)
        run: |
          set -euo pipefail
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/router-original.multipart
          # Extract just the worker.js module part from the multipart response.
          python3 - <<'PYEOF'
          import re
          data = open('/tmp/router-original.multipart','rb').read()
          # Split on the multipart boundary (first line of the file is "--<boundary>")
          boundary = data.split(b'\r\n',1)[0]
          parts = data.split(boundary)
          for p in parts:
              if b'name="worker.js"' in p or b'filename="worker.js"' in p:
                  body = p.split(b'\r\n\r\n',1)[1]
                  body = body.rsplit(b'\r\n--',1)[0].rsplit(b'\r\n',1)[0]
                  open('/tmp/router-original.js','wb').write(body)
                  print("extracted", len(body), "bytes")
                  break
          else:
              raise SystemExit("could not find worker.js part")
          PYEOF
          wc -l /tmp/router-original.js
          grep -c 'const RADAR_ORIGIN = ' /tmp/router-original.js

      - name: Show current RADAR_ORIGIN line (no secrets in this line)
        run: grep -n 'const RADAR_ORIGIN = ' /tmp/router-original.js

      - name: TIMED ROLLBACK DRILL - redeploy the unmodified current script and time it
        run: |
          set -euo pipefail
          t0=$(date +%s)
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2024-01-01","keep_bindings":["secret_text"]}' > /tmp/meta.json
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "worker.js=@/tmp/router-original.js;type=application/javascript+module" | jq -e '.success == true'
          code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://biddeed.ai/")
          t1=$(date +%s)
          echo "Rollback drill: redeploy + verify biddeed.ai/ ($code) took $((t1-t0))s"
          [[ "$code" =~ ^(2|3) ]] || { echo "Drill verification failed" >&2; exit 1; }
          [ $((t1-t0)) -lt 60 ] || echo "::warning::Drill took $((t1-t0))s, over the 60s target"

      - name: Patch RADAR_ORIGIN (exactly one line changes)
        run: |
          set -euo pipefail
          matches=$(grep -c 'const RADAR_ORIGIN = "https://biddeed-web.vercel.app";' /tmp/router-original.js)
          if [ "$matches" != "1" ]; then
            echo "Expected exactly 1 match for the known current RADAR_ORIGIN line, found $matches -- aborting, source may have changed since recon" >&2
            exit 1
          fi
          sed 's|const RADAR_ORIGIN = "https://biddeed-web.vercel.app";|const RADAR_ORIGIN = "'"$NEW_ORIGIN"'";|' \
            /tmp/router-original.js > /tmp/router-patched.js
          diff <(grep -n RADAR_ORIGIN /tmp/router-original.js) <(grep -n RADAR_ORIGIN /tmp/router-patched.js) || true
          orig_lines=$(wc -l < /tmp/router-original.js)
          new_lines=$(wc -l < /tmp/router-patched.js)
          echo "original lines: $orig_lines, patched lines: $new_lines"
          [ "$orig_lines" = "$new_lines" ] || { echo "Line count changed -- something other than the intended substitution happened" >&2; exit 1; }

      - name: Deploy patched router (keep_bindings preserves the 5 existing secrets)
        run: |
          set -euo pipefail
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2024-01-01","keep_bindings":["secret_text"]}' > /tmp/meta.json
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "worker.js=@/tmp/router-patched.js;type=application/javascript+module" | jq '{success, errors}' | tee /tmp/deploy-result.json
          jq -e '.success == true' /tmp/deploy-result.json

      - name: Confirm secret bindings survived
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.result.bindings | length, [.[].name]'

      - name: Immediate smoke suite against biddeed.ai
        id: smoke1
        run: |
          set -euo pipefail
          sleep 5
          fail=0
          for path in / /radar /discover /sign-in /sign-up /api/health /api/auctions/summary /api/auctions/calendar /chat /terms; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://biddeed.ai$path" || echo "000")
            echo "$path -> $code"
            case "$path" in
              /chat|/terms) : ;; # router-native, not part of this canary's blast radius but check anyway
              *) [[ "$code" =~ ^(2|3) ]] || fail=1 ;;
            esac
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - name: ROLLBACK if immediate smoke suite failed
        if: steps.smoke1.outputs.fail == '1'
        run: |
          set -euo pipefail
          echo "::error::Immediate smoke suite failed -- rolling back RADAR_ORIGIN to Vercel"
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2024-01-01","keep_bindings":["secret_text"]}' > /tmp/meta.json
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "worker.js=@/tmp/router-original.js;type=application/javascript+module" | jq '{success, errors}'
          exit 1

      - name: Active monitoring window (2h compressed, check every 5 min, auto-rollback on any 5xx)
        if: steps.smoke1.outputs.fail == '0'
        run: |
          set -euo pipefail
          rolled_back=0
          for i in $(seq 1 24); do
            fail=0
            ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            for path in / /radar /discover /sign-in /sign-up /api/health /api/auctions/summary /api/auctions/calendar; do
              t0=$(date +%s%3N)
              code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://biddeed.ai$path" || echo "000")
              t1=$(date +%s%3N)
              echo "$ts check#$i $path -> $code (${t1}-${t0}=$((t1-t0))ms)"
              [[ "$code" =~ ^(2|3) ]] || fail=1
            done
            if [ "$fail" = "1" ]; then
              echo "::error::Check #$i failed -- auto-rolling back"
              printf '%s' '{"main_module":"worker.js","compatibility_date":"2024-01-01","keep_bindings":["secret_text"]}' > /tmp/meta.json
              curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -F "metadata=@/tmp/meta.json;type=application/json" \
                -F "worker.js=@/tmp/router-original.js;type=application/javascript+module" | jq '{success, errors}'
              rolled_back=1
              break
            fi
            if [ "$i" -lt 24 ]; then sleep 300; fi
          done
          if [ "$rolled_back" = "1" ]; then
            echo "CANARY_RESULT=ROLLED_BACK" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "CANARY_RESULT=CLEAN_2H_WINDOW" >> "$GITHUB_STEP_SUMMARY"
          fi
